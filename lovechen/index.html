<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>震撼全屏烟花</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000; /* 纯黑背景增强对比 */
            overflow: hidden;
            touch-action: none; /* 禁止默认触摸行为 */
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 让点击穿透到 canvas */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .hint {
            color: rgba(255, 255, 255, 0.6);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 16px;
            text-align: center;
            pointer-events: auto; /* 允许点击按钮 */
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 20px;
            transition: opacity 0.5s;
        }
        .hidden {
            opacity: 0;
        }
        /* 祝福语样式 */
        .blessing {
            position: absolute;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff00de, 0 0 20px #ff00de;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            white-space: nowrap;
        }
        .blessing.show {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="hint" class="hint">点击屏幕释放烟花<br><small>手指按住可连续发射</small></div>
    <!-- 祝福语容器，JS动态插入 -->
</div>
<canvas id="canvas"></canvas>

<script>
    // --- 配置区域 ---
    const CONFIG = {
        particleCount: 150,      // 每次爆炸的粒子数量 (越大越震撼，但注意性能)
        gravity: 0.05,           // 重力 (模拟下落)
        friction: 0.96,          // 摩擦力 (空气阻力，让粒子减速)
        trailLength: 0.2,        // 拖尾长度 (越小拖尾越长，0.1-0.3)
        rocketSpeed: 8,          // 火箭升空速度
        colors: [
            '#ff0040', '#ffcc00', '#00ffcc', '#ff00ff', '#00ff00', '#ffffff', '#ffaa00', '#00ccff'
        ],
        autoLaunch: true,        // 是否自动发射
        autoLaunchInterval: 800  // 自动发射间隔(ms)
    };

    // --- 初始化 Canvas ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let fireworks = [];
    let particles = [];
    let hue = 120; // 基础色相，用于自动变色
    let limiterTotal = 5;
    let limiterTick = 0;
    let timerTotal = 80;
    let timerTick = 0;
    let mousedown = false;
    let mx, my;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        // 重置中心点
        mx = width / 2;
        my = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- 工具函数 ---
    function random(min, max) {
        return Math.random() * (max - min) + min;
    }

    function calculateDistance(p1x, p1y, p2x, p2y) {
        let xDistance = p1x - p2x;
        let yDistance = p1y - p2y;
        return Math.sqrt(Math.pow(xDistance, 2) + Math.pow(yDistance, 2));
    }

    // --- 烟花升空类 (Rocket) ---
    class Firework {
        constructor(sx, sy, tx, ty) {
            this.x = sx;
            this.y = sy;
            this.sx = sx;
            this.sy = sy;
            this.tx = tx;
            this.ty = ty;
            this.distanceToTarget = calculateDistance(sx, sy, tx, ty);
            this.distanceTraveled = 0;
            
            // 轨迹坐标
            this.coordinates = [];
            this.coordinateCount = 3;
            while (this.coordinateCount--) {
                this.coordinates.push([this.x, this.y]);
            }
            
            this.angle = Math.atan2(ty - sy, tx - sx);
            this.speed = 2;
            this.acceleration = 1.05;
            this.brightness = random(50, 70);
            this.targetRadius = 1;
            this.hue = random(0, 360);
        }

        update(index) {
            // 更新轨迹
            this.coordinates.pop();
            this.coordinates.unshift([this.x, this.y]);

            // 目标点的小圆圈动画
            if (this.targetRadius < 8) {
                this.targetRadius += 0.3;
            } else {
                this.targetRadius = 1;
            }

            // 加速
            this.speed *= this.acceleration;

            // 计算速度分量
            const vx = Math.cos(this.angle) * this.speed;
            const vy = Math.sin(this.angle) * this.speed;
            
            this.distanceTraveled = calculateDistance(this.sx, this.sy, this.x + vx, this.y + vy);

            // 到达目标点
            if (this.distanceTraveled >= this.distanceToTarget) {
                createParticles(this.tx, this.ty, this.hue);
                fireworks.splice(index, 1);
            } else {
                this.x += vx;
                this.y += vy;
            }
        }

        draw() {
            ctx.beginPath();
            // 绘制火箭尾迹
            ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
            ctx.lineTo(this.x, this.y);
            ctx.strokeStyle = `hsl(${this.hue}, 100%, ${this.brightness}%)`;
            ctx.lineWidth = 2; // 火箭比粒子粗
            ctx.stroke();
            
            // 绘制目标点提示（可选，增加真实感）
            ctx.beginPath();
            ctx.arc(this.tx, this.ty, this.targetRadius, 0, Math.PI * 2);
            ctx.stroke();
        }
    }

    // --- 爆炸粒子类 (Particle) ---
    class Particle {
        constructor(x, y, hue) {
            this.x = x;
            this.y = y;
            this.coordinates = [];
            this.coordinateCount = 5;
            while (this.coordinateCount--) {
                this.coordinates.push([this.x, this.y]);
            }
            
            // 随机角度，360度扩散
            this.angle = random(0, Math.PI * 2);
            this.speed = random(1, 15); // 速度范围大，模拟爆炸冲击力
            
            this.friction = CONFIG.friction;
            this.gravity = CONFIG.gravity;
            
            this.hue = random(hue - 20, hue + 20);
            this.brightness = random(50, 80);
            this.alpha = 1;
            this.decay = random(0.01, 0.03); // 消失速度
        }

        update(index) {
            this.coordinates.pop();
            this.coordinates.unshift([this.x, this.y]);
            
            this.speed *= this.friction;
            this.x += Math.cos(this.angle) * this.speed;
            this.y += Math.sin(this.angle) * this.speed + this.gravity;
            
            this.alpha -= this.decay;

            if (this.alpha <= this.decay) {
                particles.splice(index, 1);
            }
        }

        draw() {
            ctx.beginPath();
            ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
            ctx.lineTo(this.x, this.y);
            // 使用 lighter 模式让重叠部分更亮
            ctx.strokeStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${this.alpha})`;
            ctx.lineWidth = 2; 
            ctx.stroke();
        }
    }

    // --- 创建爆炸粒子 ---
    function createParticles(x, y, hue) {
        // 增加粒子数量以制造震撼感
        let particleCount = CONFIG.particleCount;
        while (particleCount--) {
            particles.push(new Particle(x, y, hue));
        }
        
        // 随机显示祝福语
        showBlessing(x, y);
    }

    // --- 祝福语逻辑 ---
    function showBlessing(x, y) {
        // 简单的概率触发，避免太密集
        if (Math.random() > 0.3) return; 

        const blessings = ["新年快乐", "万事如意", "恭喜发财", "心想事成", "前程似锦", "平安喜乐", "好运连连"];
        const text = blessings[Math.floor(Math.random() * blessings.length)];
        
        const div = document.createElement('div');
        div.className = 'blessing';
        div.innerText = text;
        
        // 定位：在爆炸点上方一点
        // 确保不超出屏幕
        let left = x;
        let top = y - 50;
        
        // 边界检查
        if (left > width / 2) left = width / 2;
        if (left < 0) left = 0;
        
        div.style.left = left + 'px';
        div.style.top = top + 'px';
        
        document.getElementById('ui-layer').appendChild(div);
        
        // 触发显示动画
        setTimeout(() => div.classList.add('show'), 10);
        
        // 2秒后移除
        setTimeout(() => {
            div.classList.remove('show');
            setTimeout(() => div.remove(), 500);
        }, 2000);
    }

    // --- 主循环 ---
    function loop() {
        requestAnimationFrame(loop);

        // 1. 制造拖尾效果：不彻底清除画布，而是覆盖一层半透明黑色
        ctx.globalCompositeOperation = 'destination-out';
        ctx.fillStyle = `rgba(0, 0, 0, ${CONFIG.trailLength})`;
        ctx.fillRect(0, 0, width, height);
        
        // 2. 切换回正常绘制模式
        ctx.globalCompositeOperation = 'lighter';

        // 3. 更新和绘制烟花
        let i = fireworks.length;
        while (i--) {
            fireworks[i].draw();
            fireworks[i].update(i);
        }

        // 4. 更新和绘制粒子
        let j = particles.length;
        while (j--) {
            particles[j].draw();
            particles[j].update(j);
        }

        // 5. 自动发射逻辑
        if (timerTick >= timerTotal) {
            if (!mousedown) {
                // 从底部随机位置发射到屏幕上半部分随机位置
                fireworks.push(new Firework(width / 2, height, random(0, width), random(0, height / 2)));
                timerTick = 0;
            }
        } else {
            timerTick++;
        }

        // 6. 鼠标/触摸发射逻辑
        if (mousedown) {
            // 限制发射频率
            if (limiterTick >= limiterTotal) {
                fireworks.push(new Firework(width / 2, height, mx, my));
                limiterTick = 0;
            } else {
                limiterTick++;
            }
        }
    }

    // --- 事件监听 ---
    canvas.addEventListener('mousemove', function(e) {
        mx = e.clientX;
        my = e.clientY;
    });

    canvas.addEventListener('mousedown', function(e) {
        e.preventDefault();
        mousedown = true;
        mx = e.clientX;
        my = e.clientY;
        // 隐藏提示
        document.getElementById('hint').classList.add('hidden');
    });

    canvas.addEventListener('mouseup', function(e) {
        e.preventDefault();
        mousedown = false;
    });

    // 触摸支持
    canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        mousedown = true;
        mx = e.touches[0].clientX;
        my = e.touches[0].clientY;
        document.getElementById('hint').classList.add('hidden');
    }, {passive: false});

    canvas.addEventListener('touchend', function(e) {
        e.preventDefault();
        mousedown = false;
    });

    canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
        mx = e.touches[0].clientX;
        my = e.touches[0].clientY;
    }, {passive: false});

    // 启动
    loop();

</script>
</body>
</html>
