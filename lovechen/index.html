<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>给小陈的专属烟花秀</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #020208; /* 深邃夜空蓝 */
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .hint {
            color: rgba(255, 255, 255, 0.7);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 16px;
            text-align: center;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 30px;
            transition: opacity 0.8s ease;
            position: absolute;
            top: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .hidden {
            opacity: 0;
        }
        /* 祝福语高级特效 */
        .blessing {
            position: absolute;
            color: #ffffff;
            font-size: 26px; /* 优化字体大小 */
            font-weight: 900;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            letter-spacing: 2px;
            transform: translate(-50%, -50%) scale(0.3); 
            opacity: 0;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        .blessing.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="hint" class="hint">🎵 点击屏幕 开启小陈的专属烟花秀</div>
</div>
<canvas id="canvas"></canvas>

<script>
    // --- 情感与震撼配置区域 ---
    const CONFIG = {
        particleCount: 220,      // 爆炸粒子数量
        gravity: 0.08,           // 重力
        friction: 0.97,          // 空气阻力
        trailLength: 0.12,       // 完美的拖尾留存率
        autoLaunch: true,        // 是否开启无人点击时的自动发射
        autoLaunchInterval: 1200 // 自动发射间隔(ms)（稍微拉长，防止文字重叠）
    };

    // --- 文本定制：100% 出现，不重叠 ---
    const BLESSINGS = [
        "祝小陈：生日快乐", "小陈：心想事成", "小陈：平安喜乐", 
        "万事顺遂呀小陈", "小陈：眼里有光", "岁岁平安，小陈", 
        "做最快乐的小陈", "小陈：前程似锦", "永远快乐，小陈",
        "小陈：无忧无虑", "朝朝暮暮，岁岁平安"
    ];

    // --- 声音引擎 ---
    const AudioEngine = {
        ctx: null,
        init() {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        },
        playLaunch() {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(100, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.4);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.4);
        },
        playExplode() {
            if (!this.ctx) return;
            const bufferSize = this.ctx.sampleRate * 0.4;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(600, this.ctx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.4);
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.4);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            noise.start();
        }
    };

    // --- 初始化 Canvas ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height, fireworks = [], particles = [];
    let timerTotal = CONFIG.autoLaunchInterval / 16.7;
    let timerTick = 0;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    function random(min, max) {
        return Math.random() * (max - min) + min;
    }

    function calculateDistance(p1x, p1y, p2x, p2y) {
        return Math.sqrt(Math.pow(p1x - p2x, 2) + Math.pow(p1y - p2y, 2));
    }

    // --- 烟花升空类 ---
    class Firework {
        constructor(sx, sy, tx, ty, isManual = false) {
            this.x = sx;
            this.y = sy;
            this.sx = sx;
            this.sy = sy;
            this.tx = tx;
            this.ty = ty;
            this.isManual = isManual; // 标记是否为手动点击触发
            this.distanceToTarget = calculateDistance(sx, sy, tx, ty);
            this.distanceTraveled = 0;
            this.coordinates = [];
            this.coordinateCount = 3;
            while (this.coordinateCount--) this.coordinates.push([this.x, this.y]);
            
            this.angle = Math.atan2(ty - sy, tx - sx);
            this.speed = 2;
            this.acceleration = 1.05;
            this.hue = random(0, 360);
            
            AudioEngine.playLaunch();
        }

        update(index) {
            this.coordinates.pop();
            this.coordinates.unshift([this.x, this.y]);

            this.speed *= this.acceleration;
            const vx = Math.cos(this.angle) * this.speed;
            const vy = Math.sin(this.angle) * this.speed;
            this.distanceTraveled = calculateDistance(this.sx, this.sy, this.x + vx, this.y + vy);

            if (this.distanceTraveled >= this.distanceToTarget) {
                AudioEngine.playExplode();
                createParticles(this.tx, this.ty, this.hue, this.isManual);
                fireworks.splice(index, 1);
            } else {
                this.x += vx;
                this.y += vy;
            }
        }

        draw() {
            ctx.beginPath();
            ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
            ctx.lineTo(this.x, this.y);
            ctx.strokeStyle = `hsl(${this.hue}, 100%, 70%)`;
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    }

    // --- 爆炸粒子类 ---
    class Particle {
        constructor(x, y, hue) {
            this.x = x;
            this.y = y;
            this.coordinates = [];
            this.coordinateCount = 5;
            while (this.coordinateCount--) this.coordinates.push([this.x, this.y]);
            
            this.angle = random(0, Math.PI * 2);
            this.speed = random(1, 13); 
            this.friction = CONFIG.friction;
            this.gravity = CONFIG.gravity;
            this.hue = random(hue - 15, hue + 15);
            this.alpha = 1;
            this.decay = random(0.01, 0.022); 
        }

        update(index) {
            this.coordinates.pop();
            this.coordinates.unshift([this.x, this.y]);
            
            this.speed *= this.friction;
            this.x += Math.cos(this.angle) * this.speed;
            this.y += Math.sin(this.angle) * this.speed + this.gravity;
            this.alpha -= this.decay;

            if (this.alpha <= this.decay) {
                particles.splice(index, 1);
            }
        }

        draw() {
            ctx.beginPath();
            ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
            ctx.lineTo(this.x, this.y);
            ctx.strokeStyle = `hsla(${this.hue}, 100%, 65%, ${this.alpha})`;
            ctx.lineWidth = random(1, 2.5);
            ctx.stroke();
        }
    }

    function createParticles(x, y, hue, isManual) {
        let particleCount = CONFIG.particleCount;
        while (particleCount--) {
            particles.push(new Particle(x, y, hue));
        }
        // 触发文字逻辑
        showBlessing(x, y, hue, isManual);
    }

    // --- 智能消重文字展现逻辑 ---
    function showBlessing(x, y, hue, isManual) {
        // 如果是背景自动发射的烟花，只有 30% 概率出字，给用户手动点击留出清爽的夜空
        if (!isManual && Math.random() > 0.3) return;

        const text = BLESSINGS[Math.floor(Math.random() * BLESSINGS.length)];
        
        const div = document.createElement('div');
        div.className = 'blessing';
        div.innerText = text;
        
        div.style.left = x + 'px';
        div.style.top = y + 'px';
        div.style.textShadow = `0 0 8px #fff, 0 0 15px hsl(${hue}, 100%, 60%), 0 0 30px hsl(${hue}, 100%, 50%)`;
        
        document.getElementById('ui-layer').appendChild(div);
        
        requestAnimationFrame(() => {
            div.classList.add('show');
        });
        
        // 1.5秒后优雅飘动淡出并从底层销毁
        setTimeout(() => {
            div.style.opacity = '0';
            div.style.transform = 'translate(-50%, -100%) scale(1.1)'; 
            setTimeout(() => div.remove(), 600);
        }, 1500);
    }

    // --- 主循环 ---
    function loop() {
        requestAnimationFrame(loop);
        
        ctx.globalCompositeOperation = 'destination-out';
        ctx.fillStyle = `rgba(2, 2, 8, ${CONFIG.trailLength})`; 
        ctx.fillRect(0, 0, width, height);
        ctx.globalCompositeOperation = 'lighter';

        let i = fireworks.length;
        while (i--) {
            fireworks[i].draw();
            fireworks[i].update(i);
        }

        let j = particles.length;
        while (j--) {
            particles[j].draw();
            particles[j].update(j);
        }

        // 自动发射背景烟花（独立计时）
        if (CONFIG.autoLaunch) {
            if (timerTick >= timerTotal) {
                // 自动烟花标记为 false
                fireworks.push(new Firework(random(width * 0.1, width * 0.9), height, random(width * 0.15, width * 0.85), random(height * 0.15, height * 0.45), false));
                timerTick = 0;
            } else {
                timerTick++;
            }
        }
    }

    // --- 【核心重构】触控与鼠标事件监听：从持续压制改为“单击单发” ---
    window.addEventListener('pointerdown', (e) => {
        // 激活浏览器的音频
        if (!AudioEngine.ctx) {
            AudioEngine.init();
        }
        if (AudioEngine.ctx && AudioEngine.ctx.state === 'suspended') {
            AudioEngine.ctx.resume();
        }

        // 隐藏提示框
        document.getElementById('hint').classList.add('hidden');

        // 单次点击只发射单个烟花：设定为起点在底部随机/中心，终点为你点击的手指位置
        let startX = random(width * 0.3, width * 0.7);
        // 手动烟花标记为 true（100% 触发独立文字，绝不连发重叠）
        fireworks.push(new Firework(startX, height, e.clientX, e.clientY, true));
    });

    // 启动动画主循环
    loop();
</script>
</body>
</html>
